name: Build BridgeTalk APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        run: |
          curl -L --retry 3 -o src.tar.gz "https://litter.catbox.moe/9kdj2g.gz"
          tar -xzf src.tar.gz
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & accept licenses
        env:
          ANDROID_HOME: /opt/android-sdk
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Install Gradle 7.5 manually
        run: |
          curl -L --retry 3 -o gradle.zip "https://services.gradle.org/distributions/gradle-7.5-bin.zip"
          unzip -q gradle.zip
          echo "$PWD/gradle-7.5/bin" >> $GITHUB_PATH
          gradle --version

      - name: Build Debug APK
        env:
          ANDROID_HOME: /opt/android-sdk
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridgetalk-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BridgeTalk.apk
          gh release delete v1.0 --yes --cleanup-tag || true
          gh release create v1.0 BridgeTalk.apk --title "BridgeTalk v1.0" --notes "WhatsApp live translator APK" --repo ${{ github.repository }}
