name: Build BridgeTalk APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download source
        run: |
          curl -L --retry 3 -o src.tar.gz "https://litter.catbox.moe/0yo2zn.gz"
          tar -xzf src.tar.gz
          ls -la

      - name: Fix dependency versions for compileSdk 33
        run: |
          # Public source bundle ships appcompat 1.7.0 / material 1.11.0,
          # which require compileSdk 34. Force them back to SDK-33-compatible versions.
          sed -i 's/androidx\.appcompat:appcompat:[0-9.][0-9.]*/androidx.appcompat:appcompat:1.6.1/g' app/build.gradle
          sed -i 's/com\.google\.android\.material:material:[0-9.][0-9.]*/com.google.android.material:material:1.9.0/g' app/build.gradle
          echo "--- app/build.gradle dependencies after fix ---"
          grep -E "appcompat|material" app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & accept licenses
        env:
          ANDROID_HOME: /opt/android-sdk
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Install Gradle 7.5
        run: |
          curl -L --retry 3 -o gradle.zip "https://services.gradle.org/distributions/gradle-7.5-bin.zip"
          unzip -q gradle.zip
          chmod +x gradle-7.5/bin/gradle
          ./gradle-7.5/bin/gradle --version

      - name: Build Debug APK
        env:
          ANDROID_HOME: /opt/android-sdk
        run: |
          export PATH="$PWD/gradle-7.5/bin:$PATH"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgetalk-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BridgeTalk.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" BridgeTalk.apk --title "BridgeTalk $TAG" --notes "WhatsApp live translator APK" --repo ${{ github.repository }}
