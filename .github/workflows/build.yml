name: Build BridgeTalk APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载 BridgeTalk 源码包
        run: |
          curl -L --retry 3 -o src.tar.gz "https://litter.catbox.moe/9kdj2g.gz"
          tar -xzf src.tar.gz
          echo "=== 源码解压完成 ===" && ls -la

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台并接受许可
        env:
          ANDROID_HOME: /opt/android-sdk
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: 配置 Gradle 8.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: 编译 Debug APK
        env:
          ANDROID_HOME: /opt/android-sdk
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK 产物（备份）
        uses: actions/upload-artifact@v4
        with:
          name: bridgetalk-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 发布 APK 到 Release（手机可直接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BridgeTalk.apk
          gh release delete v1.0 --yes --cleanup-tag || true
          gh release create v1.0 BridgeTalk.apk --title "BridgeTalk v1.0 - WhatsApp 实时翻译" --notes "安卓安装包，下载 BridgeTalk.apk 直接安装" --repo ${{ github.repository }}
